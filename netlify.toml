[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Hashed/static assets never change under the same name
[[headers]]
  for = "/work/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache for the favicon
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
